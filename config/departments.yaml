# Rules that turn a job title into a department.
# 1. If the exact title is under "overrides", use that.
# 2. Otherwise, check rules top to bottom. The FIRST match wins.
# 3. If nothing matches, the department is "Other".

overrides:
  Salesforce Application Administrator: IT & Security

